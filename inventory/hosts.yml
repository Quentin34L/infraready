---
# Inventaire du laboratoire InfraReady
# Les noms d'hotes Ansible sont en minuscules ; le nom NetBIOS Windows reste WIN-DC01.
all:
  children:
    windows:
      hosts:
        win-dc01:
          ansible_host: 192.168.50.10
    linux:
      hosts:
        linux01:
          ansible_host: 192.168.50.20
        ops01:
          ansible_host: 192.168.50.30
          # OPS01 est le controleur Ansible : il se gere lui-meme en local
          ansible_connection: local
    # Groupes fonctionnels (un hote peut appartenir a plusieurs groupes)
    dc:
      hosts:
        win-dc01:
    web:
      hosts:
        linux01:
    monitoring:
      hosts:
        ops01:
