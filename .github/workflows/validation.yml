---
name: Validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    name: Lint et controles du depot
    runs-on: ubuntu-24.04
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installer les outils de validation
        run: pip install -r requirements-dev.txt

      - name: Installer les collections Ansible
        run: ansible-galaxy collection install -r requirements.yml

      - name: Aucun secret en clair
        run: python3 scripts/check_secrets.py

      - name: Syntaxe YAML (yamllint)
        run: yamllint --strict .

      - name: Syntaxe des playbooks
        run: |
          for pb in playbooks/*.yml; do
            echo "== $pb"
            ansible-playbook --syntax-check "$pb"
          done

      - name: Bonnes pratiques Ansible (ansible-lint)
        run: ansible-lint

      - name: Configuration et regles Prometheus (promtool)
        run: |
          docker run --rm -v "$PWD/monitoring:/etc/prometheus:ro" \
            --entrypoint /bin/promtool prom/prometheus:v3.5.0 \
            check config /etc/prometheus/prometheus.yml

      - name: Tableaux de bord Grafana (JSON valide)
        run: |
          for f in monitoring/dashboards/*.json; do
            python3 -m json.tool "$f" > /dev/null && echo "OK $f"
          done

      - name: Scripts shell (shellcheck)
        run: shellcheck scripts/linux/*.sh
